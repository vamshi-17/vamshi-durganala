<!doctype html>
<!-- Source for public/og.png (1200×630 link-preview image). Re-render with: npm run og -->
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@400;600&display=block"
  rel="stylesheet"
/>
<style>
  :root { --bg: #0c0d0c; --fg: #eceae4; --muted: #9a9b93; --subtle: #62635d; --line: rgb(236 234 228 / 0.14); --lime: #c8f31d; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Bricolage Grotesque", sans-serif; padding: 64px 72px;
    display: flex; flex-direction: column;
  }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgb(236 234 228 / 0.09) 1.2px, transparent 1.2px); background-size: 26px 26px;
    mask-image: radial-gradient(ellipse 80% 70% at 75% 10%, black, transparent 80%); }
  .glow { position: absolute; top: -260px; right: -160px; width: 760px; height: 560px; background: radial-gradient(closest-side, rgb(200 243 29 / 0.16), transparent); }
  .mono { font-family: "JetBrains Mono", monospace; }
  .top { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
  .prompt b { color: var(--lime); font-weight: 400; } .prompt span { color: var(--subtle); }
  .caret { display: inline-block; width: 12px; height: 24px; background: var(--lime); vertical-align: -4px; margin-left: 6px; }
  .status { display: flex; align-items: center; gap: 10px; color: var(--lime); font-size: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 14px 3px rgb(200 243 29 / 0.5); }
  .req { position: relative; margin-top: 70px; display: flex; align-items: center; gap: 16px; font-size: 24px; color: var(--muted); }
  .badge { padding: 4px 12px; border-radius: 6px; font-weight: 600; font-size: 20px; }
  .get { background: rgb(200 243 29 / 0.15); color: var(--lime); }
  .ok { background: var(--lime); color: var(--bg); }
  .path { color: var(--fg); }
  h1 { position: relative; margin-top: 22px; font-size: 104px; line-height: 0.92; font-weight: 700;
    font-variation-settings: "opsz" 96, "wdth" 86; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: var(--lime); }
  .role { position: relative; margin-top: 26px; font-size: 30px; color: var(--muted); }
  .role b { color: var(--fg); font-weight: 600; }
  .bottom { position: relative; margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .topo { display: flex; align-items: center; font-size: 15px; color: var(--subtle); text-transform: uppercase; letter-spacing: 0.08em; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 92px; }
  .sq { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--subtle); background: var(--bg); }
  .sq.on { border-color: var(--lime); background: var(--lime); box-shadow: 0 0 16px 3px rgb(200 243 29 / 0.45); }
  .edge { width: 34px; height: 2px; background: var(--line); margin: 0 -24px; transform: translateY(-14px); }
  .edge.on { background: var(--lime); }
  .url { font-size: 22px; color: var(--muted); }
  .url b { color: var(--fg); font-weight: 400; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow"></div>

  <div class="top mono">
    <div class="prompt"><b>vamshi</b><span>@prod</span>:~$<i class="caret"></i></div>
    <div class="status"><i class="dot"></i>open_to_work</div>
  </div>

  <div class="req mono">
    <span class="badge get">GET</span>
    <span>api.vamshi.dev<span class="path">/engineer</span></span>
    <span>→</span>
    <span class="badge ok">200 OK</span>
  </div>

  <h1>Vamshi Krishna<br /><em>Durganala.</em></h1>

  <p class="role"><b>Full Stack Engineer</b> · Java · Spring Boot · Kafka · React · AWS</p>

  <div class="bottom">
    <div class="topo mono">
      <div class="node"><i class="sq on"></i>client</div><i class="edge on"></i>
      <div class="node"><i class="sq on"></i>gateway</div><i class="edge on"></i>
      <div class="node"><i class="sq on"></i>service</div><i class="edge"></i>
      <div class="node"><i class="sq"></i>kafka</div><i class="edge"></i>
      <div class="node"><i class="sq"></i>db</div>
    </div>
    <div class="url mono">vamshi-17.github.io/<b>vamshi-portfolio</b></div>
  </div>
</body>
</html>
